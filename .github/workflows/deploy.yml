name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check GitHub Pages status
        id: pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          status_code=$(curl -sS --oauth2-bearer "$GITHUB_TOKEN" -o /tmp/pages-api-response.json -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")

          if [ "$status_code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$status_code" = "404" ]; then
            echo "::warning::GitHub Pages is not enabled. Skipping deployment. Enable it at https://github.com/${{ github.repository }}/settings/pages"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Failed to query GitHub Pages status (HTTP $status_code)."
            cat /tmp/pages-api-response.json
            exit 1
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
